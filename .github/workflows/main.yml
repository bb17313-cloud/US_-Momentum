name: US Momentum Tracker

on:
  schedule:
    # تشغيل تلقائي كل 5 دقائق
    - cron: '*/5 * * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي أيضاً

# هذه الخاصية تقوم بإلغاء التشغيل القديم فور رفع تحديث جديد
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tradingview-screener

      - name: Run Momentum Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
