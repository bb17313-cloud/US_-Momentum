name: US_Momentum

on:
  schedule:
    # يعمل كل 3 دقائق، بين الساعة 08:00 إلى 01:59 UTC (يغطي جميع جلسات نيويورك)
    - cron: "*/3 8-23,0-1 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: "Force a session for testing: pre / market / after (leave empty for automatic)"
        required: false
        default: ""

concurrency:
  group: US_Momentum
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install tradingview-screener requests

      # استعادة ملف الأسهم المنبه عليها سابقاً
      - name: Restore seen tickers
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            seen-${{ runner.os }}-

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE_SESSION: ${{ inputs.session }}
        run: python main.py

      # حفظ حالة الملف لتحديث قائمة الأسهم للجلسة القادمة
      - name: Save seen tickers
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: seen-${{ runner.os }}-${{ github.run_id }}
